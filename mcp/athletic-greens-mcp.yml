generated: '2026-08-02'
method: searched
status: published
source: https://shop.drinkag1.com/agents.md
note: AG1 does not operate a bespoke MCP server; these are the Shopify-native agentic
  commerce endpoints served from AG1's own hosts. Every tool list below was captured
  from a live anonymous JSON-RPC tools/list call on 2026-08-02.
servers:
- name: athletic-greens-storefront-mcp
  label: AG1 Storefront MCP
  transport: http
  protocol: JSON-RPC 2.0 (Model Context Protocol)
  url: https://shop.drinkag1.com/api/mcp
  auth: none (anonymous tools/list and tool invocation for catalog + cart)
  tools_list_file: athletic-greens-tools-list.json
  x-evidence:
    fetched: '2026-08-02'
    method: POST tools/list
    http_status: 200
    content_type: application/json
  tools:
  - name: search_catalog
    description: Search for products from the online store, hosted on Shopify. Accepts
      a natural-language query, filter criteria, or both. Response conforms to the UCP
      catalog search capability (dev.ucp.shopping.catalog.search).
    input_properties: [catalog, meta]
    input_shape: 'catalog.query, catalog.context{address_country,address_region,postal_code,language,currency,intent},
      catalog.signals{dev.ucp.buyer_ip,dev.ucp.user_agent}, catalog.filters{categories,price{min,max}},
      catalog.pagination{cursor}, meta{ucp-agent{profile}}'
  - name: get_product_details
    description: Look up a product by ID; pass options to select a specific variant.
    input_properties: [product_id, options, country, language]
    required: [product_id]
  - name: get_cart
    description: Get the cart including items, shipping options, discount info and
      checkout url for a given cart id.
    input_properties: [cart_id]
    required: [cart_id]
  - name: update_cart
    description: Perform updates to a cart - add/remove/update line items, buyer
      information, delivery addresses, delivery options, discount codes, gift cards
      and note.
    input_properties: [cart_id, add_items, update_items, remove_line_ids, buyer_identity,
      delivery_addresses_to_add, delivery_addresses_to_replace, selected_delivery_options,
      discount_codes, gift_card_codes, note]
  - name: search_shop_policies_and_faqs
    description: Get facts about the store's policies, products or services.
    input_properties: [query, context]
    required: [query]
- name: athletic-greens-ucp-mcp
  label: AG1 UCP Commerce Endpoint
  transport: http
  protocol: JSON-RPC 2.0 (MCP) implementing UCP dev.ucp.shopping
  url: https://shop.drinkag1.com/api/ucp/mcp
  discovery: https://shop.drinkag1.com/.well-known/ucp
  ucp_version: '2026-04-08'
  ucp_supported_versions: ['2026-04-08', '2026-01-23']
  auth: UCP agent profile required
  gated: true
  x-evidence:
    fetched: '2026-08-02'
    method: POST tools/list (anonymous, and with an unresolvable profile URI)
    http_status: 422
    error: 'JSON-RPC -32001 UCP discovery failed / invalid_profile_url: "Unable to fetch
      agent profile: Missing profile uri"'
  capabilities:
  - dev.ucp.shopping.catalog.search
  - dev.ucp.shopping.catalog.lookup
  - dev.ucp.shopping.cart
  - dev.ucp.shopping.checkout
  - dev.ucp.shopping.fulfillment
  - dev.ucp.shopping.discount
  - dev.ucp.shopping.order
  - dev.shopify.catalog
  payment_handlers:
  - com.google.pay
  - dev.shopify.card
  - dev.shopify.shop_pay
  note: tool schemas require an authenticated/resolvable UCP agent profile; not captured.
- name: athletic-greens-customer-account-mcp
  label: AG1 Customer Account MCP
  transport: http
  protocol: JSON-RPC 2.0 (Model Context Protocol)
  url: https://account.drinkag1.com/customer/api/mcp
  auth: Shopify customer account OAuth 2.0 bearer token (scope customer-account-mcp-api:full)
    for tool invocation; tools/list answers anonymously
  tools_list_file: athletic-greens-customer-account-tools-list.json
  x-evidence:
    fetched: '2026-08-02'
    method: POST tools/list
    http_status: 200
    content_type: application/json
  tools:
  - name: get_most_recent_order_status
    description: Gets the status of the customer's most recent order.
    input_properties: []
  - name: get_order_status
    description: Fetches a specific order by order number for a logged-in customer and
      returns status details about that order.
    input_properties: [order_number]
    required: [order_number]
  - name: get_store_credit_balances
    description: Fetches the customer's store credit balances if they have any.
    input_properties: []
  - name: request_return
    description: Allows a customer to request a return for an order.
    input_properties: [order_id, order_number, line_items]
    required: [line_items]
agent_instructions:
- https://shop.drinkag1.com/agents.md
- https://shop.drinkag1.com/llms.txt
- https://shop.drinkag1.com/robots.txt
policy:
  human_approval_required: true
  statement: Checkout, payment and order placement must not be completed automatically;
    the store's robots.txt and agents.md both require an explicit, contemporaneous
    human approval step before payment.
