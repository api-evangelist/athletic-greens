aid: athletic-greens
name: AG1
description: 'AG1 (formerly Athletic Greens) is a direct-to-consumer health and nutrition
  company founded in December 2010 by Chris Ashenden and headquartered in Carson City,
  Nevada. It sells a single flagship product - AG1, a daily foundational nutrition
  powder - on a subscription model through drinkag1.com, and the brand was renamed
  from Athletic Greens to AG1 in December 2021. Revenue grew from roughly $160M in
  2021 to approximately $600M in 2024, with a valuation near $1.2B reported in January
  2025, built largely on podcast and creator affiliate marketing. AG1 is a consumer
  commerce business rather than a developer-facing API provider - it publishes no developer
  portal, no API reference and no OpenAPI - but its Shopify storefront at shop.drinkag1.com
  does expose a real, anonymously reachable agentic commerce surface: a Universal Commerce
  Protocol (UCP 2026-04-08) merchant profile at /.well-known/ucp, a Storefront MCP server
  at /api/mcp, a UCP/MCP commerce endpoint at /api/ucp/mcp, a Customer Account MCP server
  at account.drinkag1.com, an introspectable Shopify Storefront GraphQL API, and published
  agents.md / llms.txt / robots.txt agent instructions. Authentication for customer-scoped
  surfaces is Shopify customer accounts OAuth 2.0 + OpenID Connect with PKCE.'
