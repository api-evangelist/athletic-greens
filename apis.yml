apis:
- aid: athletic-greens:athletic-greens-storefront-graphql
  name: AG1 Storefront GraphQL API
  description: The Shopify Storefront GraphQL API as served from AG1's own storefront
    host, shop.drinkag1.com. Anonymous schema introspection succeeds, exposing 35 query
    fields, 41 mutations and 416 types covering products, collections, search, cart,
    delivery, discounts, gift cards and Shop Pay payment request sessions. Versioned
    on the Shopify quarterly calendar - 2025-04 through 2026-04 and `unstable` all
    answer on this host.
  humanURL: https://shop.drinkag1.com/agents.md
  baseURL: https://shop.drinkag1.com/api/2026-04/graphql.json
  tags:
  - GraphQL
  - E-Commerce
  - Storefront
  - Shopify
  tags_raw:
  - GraphQL
  - Ecommerce
  - Storefront
  - Shopify
  properties:
  - type: GraphQL
    url: graphql/athletic-greens-storefront.graphql
  - type: DataModel
    url: data-model/athletic-greens-data-model.yml
- aid: athletic-greens:athletic-greens-storefront-mcp
  name: AG1 Storefront MCP Server
  description: Anonymous Model Context Protocol server on AG1's storefront host exposing
    five tools - search_catalog, get_product_details, get_cart, update_cart and
    search_shop_policies_and_faqs - with full JSON Schema input contracts returned by
    tools/list without authentication.
  humanURL: https://shop.drinkag1.com/agents.md
  baseURL: https://shop.drinkag1.com/api/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Catalog
  - Cart
  properties:
  - type: MCPServer
    url: mcp/athletic-greens-mcp.yml
  - type: ToolCrosswalk
    url: mcp/athletic-greens-tool-crosswalk.yml
- aid: athletic-greens:athletic-greens-ucp-mcp
  name: AG1 UCP Commerce Endpoint
  description: The Universal Commerce Protocol MCP transport for AG1's store, advertised
    in the store's /.well-known/ucp merchant profile. Implements the dev.ucp.shopping
    service at UCP 2026-04-08 with cart, checkout, fulfillment, discount, order and
    catalog search/lookup capabilities plus Google Pay, Shopify Card and Shop Pay
    payment handlers. tools/list requires a resolvable UCP agent profile URI; an
    anonymous call returns JSON-RPC error -32001 invalid_profile_url.
  humanURL: https://ucp.dev/2026-04-08/specification/overview/
  baseURL: https://shop.drinkag1.com/api/ucp/mcp
  tags:
  - UCP
  - MCP
  - Agentic Commerce
  - Checkout
  properties:
  - type: WellKnown
    url: well-known/athletic-greens-ucp.json
  - type: Conformance
    url: conformance/athletic-greens-conformance.yml
- aid: athletic-greens:athletic-greens-customer-account-mcp
  name: AG1 Customer Account MCP Server
  description: Model Context Protocol server on AG1's customer account host exposing
    four order-management tools - get_most_recent_order_status, get_order_status,
    get_store_credit_balances and request_return. tools/list answers anonymously;
    invoking the tools requires a Shopify customer account OAuth token carrying the
    customer-account-mcp-api:full scope.
  humanURL: https://account.drinkag1.com/
  baseURL: https://account.drinkag1.com/customer/api/mcp
  tags:
  - MCP
  - Customer Accounts
  - Order
  - Returns
  tags_raw:
  - MCP
  - Customer Accounts
  - Orders
  - Returns
