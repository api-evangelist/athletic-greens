aid: athletic-greens
name: AG1
description: 'AG1 (formerly Athletic Greens) is a direct-to-consumer health and nutrition
  company founded in December 2010 by Chris Ashenden and headquartered in Carson City,
  Nevada. It sells a single flagship product - AG1, a daily foundational nutrition
  powder - on a subscription model through drinkag1.com, and the brand was renamed
  from Athletic Greens to AG1 in December 2021. Revenue grew from roughly $160M in
  2021 to approximately $600M in 2024, with a valuation near $1.2B reported in January
  2025, built largely on podcast and creator affiliate marketing. AG1 is a consumer
  commerce business rather than an API provider: as of the August 2026 enrichment pass
  it publishes no developer portal, no API documentation, and no machine-readable API
  contract, and DNS resolution shows no api/developer/docs subdomains. Its storefront
  runs on Shopify (shop.drinkag1.com) behind a Vercel edge, and it appears in the API
  Evangelist network as a secondary-market company profile.'
